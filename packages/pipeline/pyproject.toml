[project]
name = "eisenbalm-pipeline"
version = "0.1.0"
description = "Eisenbalm Dispatch pipeline — FastAPI + LangGraph + 14 stub agents (Phase 4 skeleton)"
requires-python = ">=3.11,<3.12"
readme = "README.md"
dependencies = [
  "fastapi==0.136.1",
  "uvicorn[standard]==0.46.0",
  "langgraph==1.1.10",
  "langgraph-checkpoint-postgres==3.1.0",
  "psycopg[binary]>=3.2,<4",
  "pydantic==2.13.4",
  "httpx==0.28.1",
  "langchain-openai==1.2.1",
  "supabase==2.30.0",
  "python-slugify==8.0.4",
  "tavily-python==0.7.24",       # Phase 5 D-09 — REST client (fallback if langchain-tavily import fails)
  "langchain-tavily==0.2.18",    # Phase 5 D-09 — preferred LangChain Tavily integration
  "selectolax==0.4.9",           # Phase 5 D-11 — fast HTML-to-text for agents/verify.py
  "weasyprint==68.1",            # Phase 6 PDF-01 — HTML→PDF renderer
  "jinja2==3.1.6",               # Phase 6 PDF-01 — HTML template engine
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eisenbalm_pipeline"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "eisenbalm_pipeline/prompts"

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
