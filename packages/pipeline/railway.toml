# packages/pipeline/railway.toml
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# startCommand intentionally omitted — Dockerfile CMD uses shell form
# with ${PORT:-8000} which Railway expands at runtime. Setting a
# startCommand here would override the Dockerfile CMD and Railway does
# not run it through a shell, so $PORT stays a literal string.
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Phase 4 + Phase 6: idempotent DDL on every deploy. Railway caps
# preDeployCommand at a single array element, so the two setup subcommands
# are chained via `sh -c` (slim image has sh, not bash). They run in order;
# both are safe under concurrent invocation (Postgres advisory lock for
# checkpoints; CREATE TABLE IF NOT EXISTS for webhook_idempotency).
preDeployCommand = ["sh -c 'python -m eisenbalm_pipeline.cli setup-checkpointer && python -m eisenbalm_pipeline.cli setup-webhook-idempotency'"]
